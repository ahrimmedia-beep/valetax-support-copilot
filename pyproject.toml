[project]
name = "valetax-support-copilot"
version = "0.1.0"
description = "Support-ticket co-pilot for a retail forex/CFD broker: classify, draft grounded replies with citations, route to humans."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.99",
    "snowballstemmer>=3.1.1",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
copilot = "copilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # non-ASCII text is intentional (multilingual keywords)
    "SIM905",  # a whitespace-separated stopword string reads better than a 90-item list
]

[tool.ruff.lint.per-file-ignores]
# Long regex alternations and Markdown table rows are clearer unbroken.
"copilot/guardrails.py" = ["E501"]
"eval/run.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["copilot", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
